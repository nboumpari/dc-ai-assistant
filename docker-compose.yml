# Local services.
#   docker compose up -d                             start Qdrant, the API and the web page
#   docker compose run --rm app python -m <module>   run project code in Linux (indexing, evaluations)
# Chat page:        http://localhost:5173
# Qdrant dashboard: http://localhost:6333/dashboard
# API:              http://localhost:8000/api/health

services:
  qdrant:
    image: qdrant/qdrant:v1.20.2
    container_name: dc-ai-qdrant
    ports:
      - "6333:6333"   # REST API and dashboard: http://localhost:6333/dashboard
    volumes:
      - ./data/index/qdrant:/qdrant/storage
    restart: unless-stopped

  app:
    build: .
    image: dc-ai-assistant:dev
    profiles: ["tools"]   # not started by `up`; used with `docker compose run`
    working_dir: /app
    volumes:
      - .:/app                 # project code and data (reads .env from here)
      - hf-models:/models      # Hugging Face model cache, kept between runs
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant

  api:
    image: dc-ai-assistant:dev
    container_name: dc-ai-api
    working_dir: /app
    command: uvicorn dc_ai_assistant.api:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - hf-models:/models
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant

  web:
    image: node:22.12.0-alpine
    container_name: dc-ai-web
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - web-modules:/app/node_modules   # Linux node_modules, kept out of the Windows folder
    environment:
      API_URL: http://api:8000
    depends_on:
      - api

volumes:
  hf-models:
  web-modules:
