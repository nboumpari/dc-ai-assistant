# The DC AI Assistant: the chat page, the API and the vector database.
#
#   docker compose up -d --build        start everything      -> http://localhost:8080
#   docker compose down                 stop it
#   docker compose run --rm app ...     setup and evaluation commands (see README)
#
# Development (mounted code, auto-reload, Vite dev server on http://localhost:5173):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# The images contain code only. The database, the documents' chunks, the vector index
# and the models stay on this machine and are mounted in (see README, "Setup").

services:
  qdrant:
    image: qdrant/qdrant:v1.20.2
    container_name: dc-ai-qdrant
    ports:
      - "6333:6333"   # REST API and dashboard: http://localhost:6333/dashboard
    volumes:
      - ./data/index/qdrant:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    image: ${API_IMAGE:-dc-ai-assistant-api:latest}   # or a published release (see README)
    container_name: dc-ai-api
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      HF_HUB_OFFLINE: "1"   # the models were downloaded during setup
    volumes:
      - ./data:/app/data:ro
      - hf-models:/models
    depends_on:
      - qdrant
    restart: unless-stopped

  web:
    build: ./frontend
    image: ${WEB_IMAGE:-dc-ai-assistant-web:latest}
    container_name: dc-ai-web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # setup and evaluation commands, with the project folder mounted: docker compose run --rm app ...
  app:
    build:
      context: .
      target: base
    image: dc-ai-assistant:dev
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - .:/app
      - hf-models:/models
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant

volumes:
  hf-models:
