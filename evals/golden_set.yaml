# Golden set for the data agent and the supervisor's routing.
#
# Hand-written: the questions, how each should be handled, and a reference SQL
# query. The expected answers are NOT typed here: build_golden_set.py runs each
# reference query on the database and stores the result.
#
# Fields
#   id          stable identifier, used to sync with LangSmith
#   question    what the user asks
#   stratum     question category (see below)
#   difficulty  easy | medium | hard
#   split       dev (used while improving the prompt) | test (only for the final score)
#   route       where the supervisor should send it: data_agent | rules_agent | clarify | out_of_scope
#   behavior    what the data agent should do: answer | clarify | refuse | decline
#   sql         reference query (only for behavior: answer)
#   compare     how to compare results:
#                 scalar        the single expected value appears in the agent's first row
#                 rows          same rows, any order
#                 ordered_rows  same rows, same order
#                 top1          only the first expected row must match the agent's first row
#                 values        every expected value appears somewhere in the result, in any shape
#               Values match regardless of column names and order; the agent may return extra columns.
#               Reference queries therefore return only the columns the question asks for.
#   key_facts   facts a correct answer must contain (checked by the LLM judge)
#
# Strata: lookup, aggregation, join, time, kpi, pattern, data_quality,
#         ambiguous, refuse, out_of_scope

questions:

  # ---------------------------------------------------------------- lookup
  - id: L01
    question: Which DC serves customer CUS012?
    stratum: lookup
    difficulty: easy
    split: dev
    route: data_agent
    behavior: answer
    compare: scalar
    sql: SELECT home_warehouse_id FROM customers WHERE customer_id = 'CUS012'

  - id: L02
    question: What is the delivery window of Ampeli Markets?
    stratum: lookup
    difficulty: easy
    split: dev
    route: data_agent
    behavior: answer
    compare: rows
    sql: |
      SELECT delivery_window_start, delivery_window_end
      FROM customers WHERE customer_name = 'Ampeli Markets'

  - id: L03
    question: What is the status of order O-004567?
    stratum: lookup
    difficulty: easy
    split: test
    route: data_agent
    behavior: answer
    compare: scalar
    sql: SELECT status FROM orders WHERE order_id = 'O-004567'

  - id: L04
    question: How many cases fit on a full pallet of Kalli Hair spray 400ml?
    stratum: lookup
    difficulty: easy
    split: dev
    route: data_agent
    behavior: answer
    compare: scalar
    sql: SELECT cases_per_pallet FROM products WHERE product_name = 'Kalli Hair spray 400ml'

  - id: L05
    question: Which of our sites are run by a 3PL, and who operates them?
    stratum: lookup
    difficulty: easy
    split: test
    route: data_agent
    behavior: answer
    compare: rows
    sql: SELECT warehouse_id, operator_name FROM warehouses WHERE operator_type = '3PL' ORDER BY warehouse_id

  - id: L06
    question: What is the tallest pallet Ampeli Markets will accept?
    stratum: lookup
    difficulty: easy
    split: dev
    route: data_agent
    behavior: answer
    compare: scalar
    sql: SELECT max_pallet_height_cm FROM customers WHERE customer_name = 'Ampeli Markets'

  # ----------------------------------------------------------- aggregation
  - id: A01
    question: How many customer orders were placed in 2025?
    stratum: aggregation
    difficulty: easy
    split: dev
    route: data_agent
    behavior: answer
    compare: scalar
    sql: SELECT COUNT(*) FROM orders WHERE order_date BETWEEN '2025-01-01' AND '2025-12-31 23:59:59'

  - id: A02
    question: How many pallets left the Patras DC in March 2025?
    stratum: aggregation
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: scalar
    sql: |
      SELECT COUNT(DISTINCT p.sscc)
      FROM pallets p JOIN shipments s USING (shipment_id)
      WHERE s.origin_warehouse_id = 'PAT' AND strftime('%Y-%m', s.actual_ship_at) = '2025-03'

  - id: A03
    question: How many customers does each DC serve?
    stratum: aggregation
    difficulty: easy
    split: test
    route: data_agent
    behavior: answer
    compare: rows
    sql: SELECT home_warehouse_id, COUNT(*) FROM customers GROUP BY 1 ORDER BY 1

  - id: A04
    question: What were the total cases ordered per product category in 2025, from highest to lowest?
    stratum: aggregation
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: ordered_rows
    sql: |
      SELECT p.category, SUM(ol.qty_ordered_cases) AS cases
      FROM order_lines ol JOIN products p USING (sku)
      GROUP BY 1 ORDER BY 2 DESC

  - id: A05
    question: How many stock transfers did the plant send to each DC?
    stratum: aggregation
    difficulty: easy
    split: dev
    route: data_agent
    behavior: answer
    compare: rows
    sql: |
      SELECT to_warehouse_id, COUNT(*) FROM stock_transfers
      WHERE from_warehouse_id = 'PLT' GROUP BY 1 ORDER BY 1

  - id: A06
    question: On average, how many lines does a customer order have?
    stratum: aggregation
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: scalar
    sql: SELECT ROUND(1.0 * (SELECT COUNT(*) FROM order_lines) / (SELECT COUNT(*) FROM orders), 2)

  - id: A07
    question: How many production batches did the plant make in 2025?
    stratum: aggregation
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: scalar
    key_facts:
      - Only batches produced in 2025 count; the opening-stock batches from December 2024 are excluded.
    sql: SELECT COUNT(*) FROM production_batches WHERE produced_at >= '2025-01-01'

  - id: A08
    question: Which 5 products had the most cases shipped to customers?
    stratum: aggregation
    difficulty: medium
    split: test
    route: data_agent
    behavior: answer
    compare: ordered_rows
    sql: |
      SELECT sku, SUM(qty_shipped_cases) AS cases
      FROM order_lines GROUP BY 1 ORDER BY 2 DESC LIMIT 5

  # ------------------------------------------------------------------ join
  - id: J01
    question: Which customers received goods from batch L25134-HAI-007?
    stratum: join
    difficulty: hard
    split: dev
    route: data_agent
    behavior: answer
    compare: rows
    sql: |
      SELECT DISTINCT c.customer_id, c.customer_name
      FROM pallet_contents pc
      JOIN order_lines ol USING (order_line_id)
      JOIN orders o USING (order_id)
      JOIN customers c USING (customer_id)
      JOIN pallets p ON p.sscc = pc.sscc
      JOIN shipments s ON s.shipment_id = p.shipment_id
      WHERE pc.batch_lot = 'L25134-HAI-007' AND s.actual_delivery_at IS NOT NULL
      ORDER BY 1

  - id: J02
    question: Which carrier delivered order O-000123, and when was it delivered?
    stratum: join
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: rows
    sql: |
      SELECT c.carrier_name, s.actual_delivery_at
      FROM shipments s JOIN carriers c USING (carrier_id)
      WHERE s.order_id = 'O-000123' AND s.shipment_type = 'customer delivery'

  - id: J03
    question: What is on pallet 320000000000090413?
    stratum: join
    difficulty: medium
    split: test
    route: data_agent
    behavior: answer
    compare: rows
    sql: |
      SELECT sku, qty_cases, batch_lot
      FROM pallet_contents WHERE sscc = '320000000000090413' ORDER BY 1

  - id: J04
    question: For order O-007000, list each product with the cases ordered and the cases shipped.
    stratum: join
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: rows
    sql: |
      SELECT sku, qty_ordered_cases, qty_shipped_cases
      FROM order_lines WHERE order_id = 'O-007000' ORDER BY 1

  - id: J05
    question: Which DC shipped the most cases to customers in the Cyclades?
    stratum: join
    difficulty: medium
    split: test
    route: data_agent
    behavior: answer
    compare: top1
    sql: |
      SELECT o.warehouse_id, SUM(ol.qty_shipped_cases) AS cases
      FROM orders o JOIN order_lines ol USING (order_id) JOIN customers c USING (customer_id)
      WHERE c.region = 'Cyclades'
      GROUP BY 1 ORDER BY 2 DESC

  - id: J06
    question: How many transfer lines from Thessaloniki to Athens arrived with fewer cases than were shipped?
    stratum: join
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: scalar
    key_facts:
      - Only transfers that have been received count.
    sql: |
      SELECT COUNT(*)
      FROM stock_transfer_lines tl JOIN stock_transfers t USING (transfer_id)
      WHERE t.from_warehouse_id = 'THE' AND t.to_warehouse_id = 'ATH'
        AND t.status = 'received' AND tl.qty_received_cases < tl.qty_shipped_cases

  - id: J07
    question: Show the dock appointments for shipment S-000588 with the door and status.
    stratum: join
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: rows
    sql: |
      SELECT dock_door, status
      FROM dock_appointments WHERE shipment_id = 'S-000588' ORDER BY slot_start

  - id: J08
    question: Which customers sent goods back later because they received the wrong product?
    stratum: join
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: rows
    sql: |
      SELECT DISTINCT c.customer_id, c.customer_name
      FROM customer_returns r JOIN customers c USING (customer_id)
      WHERE r.return_type = 'later return' AND r.reason_code = 'wrong product'
      ORDER BY 1

  # ------------------------------------------------------------------ time
  - id: T01
    question: How many orders were placed last month?
    stratum: time
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: scalar
    key_facts:
      - Last month is December 2025, because the data ends on 31 December 2025.
    sql: SELECT COUNT(*) FROM orders WHERE strftime('%Y-%m', order_date) = '2025-12'

  - id: T02
    question: How many orders did we get in July compared with August 2025?
    stratum: time
    difficulty: easy
    split: test
    route: data_agent
    behavior: answer
    compare: rows
    sql: |
      SELECT strftime('%Y-%m', order_date) AS month, COUNT(*)
      FROM orders WHERE strftime('%Y-%m', order_date) IN ('2025-07', '2025-08')
      GROUP BY 1 ORDER BY 1

  - id: T03
    question: On which day of the week do we receive the most customer orders?
    stratum: time
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: top1
    sql: |
      SELECT CASE strftime('%w', order_date)
               WHEN '0' THEN 'Sunday' WHEN '1' THEN 'Monday' WHEN '2' THEN 'Tuesday'
               WHEN '3' THEN 'Wednesday' WHEN '4' THEN 'Thursday' WHEN '5' THEN 'Friday'
               ELSE 'Saturday' END AS weekday,
             COUNT(*) AS orders
      FROM orders GROUP BY 1 ORDER BY 2 DESC

  - id: T04
    question: How many shipments were still on the road at the end of the year?
    stratum: time
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: scalar
    sql: SELECT COUNT(*) FROM shipments WHERE status = 'in transit'

  - id: T05
    question: What is the average transit time in hours for stock transfers from Thessaloniki to Athens?
    stratum: time
    difficulty: hard
    split: test
    route: data_agent
    behavior: answer
    compare: scalar
    sql: |
      SELECT ROUND(AVG((julianday(actual_delivery_at) - julianday(actual_ship_at)) * 24), 1)
      FROM shipments
      WHERE shipment_type = 'stock transfer' AND origin_warehouse_id = 'THE'
        AND destination_warehouse_id = 'ATH' AND actual_delivery_at IS NOT NULL

  - id: T06
    question: How many orders placed in Q4 2025 left the DC after their cut-off time?
    stratum: time
    difficulty: hard
    split: dev
    route: data_agent
    behavior: answer
    compare: scalar
    sql: |
      SELECT COUNT(*)
      FROM orders o JOIN shipments s ON s.order_id = o.order_id AND s.shipment_type = 'customer delivery'
      WHERE s.actual_ship_at > o.cutoff_time
        AND o.order_date BETWEEN '2025-10-01' AND '2025-12-31 23:59:59'

  # ------------------------------------------------------------------- kpi
  - id: K01
    question: What was our OTIF in 2025?
    stratum: kpi
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: scalar
    sql: |
      WITH refused AS (
        SELECT rl.original_order_line_id AS order_line_id, SUM(rl.qty_requested_cases) AS cases
        FROM customer_return_lines rl JOIN customer_returns r USING (return_id)
        WHERE r.return_type = 'refused at delivery' GROUP BY 1
      ),
      order_check AS (
        SELECT o.order_id,
               o.status <> 'cancelled'
               AND MIN(ol.qty_shipped_cases - COALESCE(rf.cases, 0) = ol.qty_ordered_cases) AS in_full,
               MAX(s.actual_delivery_at IS NOT NULL
                   AND s.actual_delivery_at <= datetime(s.planned_delivery_at, '+30 minutes')) AS on_time
        FROM orders o
        JOIN order_lines ol USING (order_id)
        LEFT JOIN refused rf USING (order_line_id)
        LEFT JOIN shipments s ON s.order_id = o.order_id AND s.shipment_type = 'customer delivery'
        WHERE o.requested_delivery_date <= '2025-12-31'
        GROUP BY o.order_id
      )
      SELECT ROUND(100.0 * AVG(on_time AND in_full), 1) FROM order_check

  - id: K02
    question: What was the on-time delivery rate of each carrier?
    stratum: kpi
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: rows
    sql: |
      SELECT c.carrier_name,
             ROUND(100.0 * AVG(s.actual_delivery_at IS NOT NULL
                               AND s.actual_delivery_at <= datetime(s.planned_delivery_at, '+30 minutes')), 1) AS on_time_pct
      FROM orders o
      JOIN shipments s ON s.order_id = o.order_id AND s.shipment_type = 'customer delivery'
      JOIN carriers c USING (carrier_id)
      WHERE o.requested_delivery_date <= '2025-12-31'
      GROUP BY 1 ORDER BY 2 DESC

  - id: K03
    question: Which DC had the lowest in-full rate?
    stratum: kpi
    difficulty: medium
    split: test
    route: data_agent
    behavior: answer
    compare: top1
    sql: |
      WITH refused AS (
        SELECT rl.original_order_line_id AS order_line_id, SUM(rl.qty_requested_cases) AS cases
        FROM customer_return_lines rl JOIN customer_returns r USING (return_id)
        WHERE r.return_type = 'refused at delivery' GROUP BY 1
      ),
      order_check AS (
        SELECT o.order_id, o.warehouse_id,
               o.status <> 'cancelled'
               AND MIN(ol.qty_shipped_cases - COALESCE(rf.cases, 0) = ol.qty_ordered_cases) AS in_full
        FROM orders o JOIN order_lines ol USING (order_id) LEFT JOIN refused rf USING (order_line_id)
        WHERE o.requested_delivery_date <= '2025-12-31'
        GROUP BY o.order_id
      )
      SELECT warehouse_id, ROUND(100.0 * AVG(in_full), 1) AS in_full_pct
      FROM order_check GROUP BY 1 ORDER BY 2 ASC

  - id: K04
    question: What was OTIF by month?
    stratum: kpi
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: rows
    sql: |
      WITH refused AS (
        SELECT rl.original_order_line_id AS order_line_id, SUM(rl.qty_requested_cases) AS cases
        FROM customer_return_lines rl JOIN customer_returns r USING (return_id)
        WHERE r.return_type = 'refused at delivery' GROUP BY 1
      ),
      order_check AS (
        SELECT o.order_id, strftime('%Y-%m', o.requested_delivery_date) AS month,
               o.status <> 'cancelled'
               AND MIN(ol.qty_shipped_cases - COALESCE(rf.cases, 0) = ol.qty_ordered_cases) AS in_full,
               MAX(s.actual_delivery_at IS NOT NULL
                   AND s.actual_delivery_at <= datetime(s.planned_delivery_at, '+30 minutes')) AS on_time
        FROM orders o
        JOIN order_lines ol USING (order_id)
        LEFT JOIN refused rf USING (order_line_id)
        LEFT JOIN shipments s ON s.order_id = o.order_id AND s.shipment_type = 'customer delivery'
        WHERE o.requested_delivery_date <= '2025-12-31'
        GROUP BY o.order_id
      )
      SELECT month, ROUND(100.0 * AVG(on_time AND in_full), 1) AS otif_pct
      FROM order_check GROUP BY 1 ORDER BY 1

  - id: K05
    question: Which carrier has the highest pallet damage rate?
    stratum: kpi
    difficulty: medium
    split: test
    route: data_agent
    behavior: answer
    compare: top1
    sql: |
      SELECT c.carrier_name, ROUND(100.0 * COUNT(DISTINCT e.sscc) / COUNT(DISTINCT p.sscc), 2) AS damage_pct
      FROM pallets p
      JOIN shipments s USING (shipment_id)
      JOIN carriers c USING (carrier_id)
      LEFT JOIN pallet_events e ON e.sscc = p.sscc AND e.event_type = 'damaged'
      WHERE s.shipment_type = 'customer delivery' AND s.actual_delivery_at IS NOT NULL
      GROUP BY 1 ORDER BY 2 DESC

  - id: K06
    question: What is the pallet refusal rate for each DC?
    stratum: kpi
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: rows
    sql: |
      SELECT s.origin_warehouse_id, ROUND(100.0 * COUNT(DISTINCT e.sscc) / COUNT(DISTINCT p.sscc), 2) AS refusal_pct
      FROM pallets p
      JOIN shipments s USING (shipment_id)
      LEFT JOIN pallet_events e ON e.sscc = p.sscc AND e.event_type = 'rejected'
      WHERE s.shipment_type = 'customer delivery' AND s.actual_delivery_at IS NOT NULL
      GROUP BY 1 ORDER BY 1

  - id: K07
    question: What was the average dock wait time at each site?
    stratum: kpi
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: rows
    sql: |
      SELECT warehouse_id, ROUND(AVG((julianday(dock_start_at) - julianday(checked_in_at)) * 1440), 1) AS wait_min
      FROM dock_appointments WHERE status = 'completed'
      GROUP BY 1 ORDER BY 1

  - id: K08
    question: Which carrier has the highest no-show rate at our docks?
    stratum: kpi
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: top1
    sql: |
      SELECT c.carrier_name, ROUND(100.0 * AVG(d.status = 'no-show'), 2) AS no_show_pct
      FROM dock_appointments d JOIN carriers c USING (carrier_id)
      WHERE d.slot_end <= '2025-12-31 23:59:59'
      GROUP BY 1 ORDER BY 2 DESC

  - id: K09
    question: What is our return rate, and which return reason accounts for the most returned cases?
    stratum: kpi
    difficulty: hard
    split: dev
    route: data_agent
    behavior: answer
    compare: top1
    key_facts:
      - The return rate counts later returns only; refusals at delivery are a separate KPI.
    sql: |
      WITH delivered AS (
        SELECT SUM(ol.qty_shipped_cases) AS cases
        FROM order_lines ol
        JOIN shipments s ON s.order_id = ol.order_id AND s.shipment_type = 'customer delivery'
        WHERE s.actual_delivery_at IS NOT NULL
      ),
      returned AS (
        SELECT r.reason_code, SUM(rl.qty_requested_cases) AS cases
        FROM customer_return_lines rl JOIN customer_returns r USING (return_id)
        WHERE r.return_type = 'later return' GROUP BY 1
      )
      SELECT returned.reason_code,
             ROUND(100.0 * (SELECT SUM(cases) FROM returned) / delivered.cases, 2) AS return_rate_pct
      FROM returned, delivered ORDER BY returned.cases DESC

  - id: K10
    question: What was OTIF for orders delivered by Hermes Freight in Q3 2025?
    stratum: kpi
    difficulty: hard
    split: test
    route: data_agent
    behavior: answer
    compare: scalar
    sql: |
      WITH refused AS (
        SELECT rl.original_order_line_id AS order_line_id, SUM(rl.qty_requested_cases) AS cases
        FROM customer_return_lines rl JOIN customer_returns r USING (return_id)
        WHERE r.return_type = 'refused at delivery' GROUP BY 1
      ),
      order_check AS (
        SELECT o.order_id,
               o.status <> 'cancelled'
               AND MIN(ol.qty_shipped_cases - COALESCE(rf.cases, 0) = ol.qty_ordered_cases) AS in_full,
               MAX(s.actual_delivery_at IS NOT NULL
                   AND s.actual_delivery_at <= datetime(s.planned_delivery_at, '+30 minutes')) AS on_time
        FROM orders o
        JOIN order_lines ol USING (order_id)
        LEFT JOIN refused rf USING (order_line_id)
        JOIN shipments s ON s.order_id = o.order_id AND s.shipment_type = 'customer delivery'
        WHERE s.carrier_id = 'CAR03' AND o.requested_delivery_date BETWEEN '2025-07-01' AND '2025-09-30'
        GROUP BY o.order_id
      )
      SELECT ROUND(100.0 * AVG(on_time AND in_full), 1) FROM order_check

  # --------------------------------------------------------------- pattern
  - id: P01
    question: Is there a carrier that is late much more often on a particular day of the week?
    stratum: pattern
    difficulty: hard
    split: dev
    route: data_agent
    behavior: answer
    compare: top1
    key_facts:
      - Hermes Freight (CAR03) is late far more often on Mondays than on other days.
    sql: |
      WITH late AS (
        SELECT c.carrier_name, strftime('%w', s.planned_delivery_at) AS weekday,
               AVG(s.actual_delivery_at > datetime(s.planned_delivery_at, '+30 minutes')) AS late_rate
        FROM shipments s JOIN carriers c USING (carrier_id)
        WHERE s.shipment_type = 'customer delivery' AND s.actual_delivery_at IS NOT NULL
        GROUP BY 1, 2
      ),
      overall AS (
        SELECT c.carrier_name, AVG(s.actual_delivery_at > datetime(s.planned_delivery_at, '+30 minutes')) AS late_rate
        FROM shipments s JOIN carriers c USING (carrier_id)
        WHERE s.shipment_type = 'customer delivery' AND s.actual_delivery_at IS NOT NULL
        GROUP BY 1
      )
      SELECT late.carrier_name,
             CASE late.weekday WHEN '1' THEN 'Monday' WHEN '2' THEN 'Tuesday' WHEN '3' THEN 'Wednesday'
                  WHEN '4' THEN 'Thursday' WHEN '5' THEN 'Friday' WHEN '6' THEN 'Saturday' ELSE 'Sunday' END AS weekday
      FROM late JOIN overall USING (carrier_name)
      ORDER BY late.late_rate - overall.late_rate DESC

  - id: P02
    question: In which month were the most Personal care cases ordered?
    stratum: pattern
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: top1
    key_facts:
      - Personal care demand peaks in summer, highest in July.
    sql: |
      SELECT strftime('%Y-%m', o.order_date) AS month
      FROM order_lines ol JOIN orders o USING (order_id) JOIN products p USING (sku)
      WHERE p.category = 'Personal care'
      GROUP BY 1 ORDER BY SUM(ol.qty_ordered_cases) DESC

  - id: P03
    question: Which customer refuses the most pallets, and why?
    stratum: pattern
    difficulty: hard
    split: dev
    route: data_agent
    behavior: answer
    compare: top1
    key_facts:
      - Ampeli Markets (CUS001) refuses by far the most pallets.
      - Most of its refused pallets were taller than its 160 cm limit.
    sql: |
      SELECT c.customer_name, COUNT(DISTINCT e.sscc) AS refused_pallets
      FROM pallet_events e
      JOIN pallets p USING (sscc)
      JOIN shipments s USING (shipment_id)
      JOIN orders o USING (order_id)
      JOIN customers c USING (customer_id)
      WHERE e.event_type = 'rejected'
      GROUP BY 1 ORDER BY 2 DESC

  - id: P04
    question: In which week was the Athens DC's fill rate for baby care products lowest, and why?
    stratum: pattern
    difficulty: hard
    split: dev
    route: data_agent
    behavior: answer
    compare: top1
    key_facts:
      - Baby care fill at Athens dropped sharply in the week of 4-10 August 2025.
      - Inbound stock transfers to Athens were held at origin (delayed), so Athens ran out of stock.
    sql: |
      SELECT date(o.order_date, '-6 days', 'weekday 1') AS week_start
      FROM order_lines ol JOIN orders o USING (order_id) JOIN products p USING (sku)
      WHERE o.warehouse_id = 'ATH' AND p.category = 'Baby care'
        AND o.order_date BETWEEN '2025-07-14' AND '2025-08-31 23:59:59'
      GROUP BY 1 ORDER BY 1.0 * SUM(ol.qty_shipped_cases) / SUM(ol.qty_ordered_cases)

  - id: P05
    question: Are we losing stock in transit on any transfer route?
    stratum: pattern
    difficulty: hard
    split: test
    route: data_agent
    behavior: answer
    compare: rows
    key_facts:
      - Only the Thessaloniki to Athens route loses cases in transit.
    sql: |
      SELECT t.from_warehouse_id, t.to_warehouse_id,
             SUM(tl.qty_shipped_cases - tl.qty_received_cases) AS cases_lost
      FROM stock_transfer_lines tl JOIN stock_transfers t USING (transfer_id)
      WHERE t.status = 'received'
      GROUP BY 1, 2 HAVING cases_lost > 0 ORDER BY 3 DESC

  - id: P06
    question: Where and when do trucks wait longest at the dock?
    stratum: pattern
    difficulty: hard
    split: dev
    route: data_agent
    behavior: answer
    compare: top1
    key_facts:
      - Trucks wait longest at the Athens DC in the morning (about 06:00-10:00).
    sql: |
      SELECT warehouse_id
      FROM dock_appointments WHERE status = 'completed'
      GROUP BY warehouse_id, strftime('%H', checked_in_at)
      ORDER BY AVG((julianday(dock_start_at) - julianday(checked_in_at)) * 1440) DESC

  - id: P07
    question: Is there a production batch with quality problems, and which customers are affected?
    stratum: pattern
    difficulty: hard
    split: test
    route: data_agent
    behavior: answer
    compare: top1
    key_facts:
      - Batch L25134-HAI-007 (Kalli Hair spray 400ml) has many quality-complaint returns from different customers.
    sql: |
      SELECT rl.batch_lot, COUNT(DISTINCT r.customer_id) AS customers
      FROM customer_return_lines rl JOIN customer_returns r USING (return_id)
      WHERE r.reason_code = 'quality complaint'
      GROUP BY 1 ORDER BY 2 DESC

  - id: P08
    question: Which month had the fewest customer orders, and which month had the highest dock no-show rate?
    stratum: pattern
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: values
    key_facts:
      - August has clearly fewer orders than other months.
      - The dock no-show rate is clearly higher in August.
    sql: |
      SELECT (SELECT strftime('%Y-%m', order_date) FROM orders GROUP BY 1 ORDER BY COUNT(*) LIMIT 1) AS fewest_orders,
             (SELECT strftime('%Y-%m', slot_start) FROM dock_appointments
              GROUP BY 1 ORDER BY AVG(status = 'no-show') DESC LIMIT 1) AS highest_no_show

  # ---------------------------------------------------------- data quality
  - id: D01
    question: Are there pallets whose SSCC has an invalid check digit? How many?
    stratum: data_quality
    difficulty: hard
    split: dev
    route: data_agent
    behavior: answer
    compare: scalar
    sql: |
      SELECT COUNT(*) FROM pallets
      WHERE (10 - ((3 * substr(sscc, 1, 1) + substr(sscc, 2, 1) + 3 * substr(sscc, 3, 1) + substr(sscc, 4, 1)
                  + 3 * substr(sscc, 5, 1) + substr(sscc, 6, 1) + 3 * substr(sscc, 7, 1) + substr(sscc, 8, 1)
                  + 3 * substr(sscc, 9, 1) + substr(sscc, 10, 1) + 3 * substr(sscc, 11, 1) + substr(sscc, 12, 1)
                  + 3 * substr(sscc, 13, 1) + substr(sscc, 14, 1) + 3 * substr(sscc, 15, 1) + substr(sscc, 16, 1)
                  + 3 * substr(sscc, 17, 1)) % 10)) % 10 <> CAST(substr(sscc, 18, 1) AS INTEGER)

  - id: D02
    question: Do any pallet scans look duplicated? How many extra scans are there?
    stratum: data_quality
    difficulty: medium
    split: test
    route: data_agent
    behavior: answer
    compare: scalar
    key_facts:
      - A duplicate is a scan with the same pallet, event type, time, location and scanner as another scan.
    sql: |
      SELECT COUNT(*) - (SELECT COUNT(*) FROM (SELECT DISTINCT sscc, event_type, event_at, location, scanned_by
                                               FROM pallet_events))
      FROM pallet_events

  - id: D03
    question: How many pallets departed without ever being scanned as loaded?
    stratum: data_quality
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: scalar
    sql: |
      SELECT COUNT(DISTINCT sscc) FROM pallet_events d
      WHERE d.event_type = 'departed'
        AND NOT EXISTS (SELECT 1 FROM pallet_events l WHERE l.sscc = d.sscc AND l.event_type = 'loaded')

  - id: D04
    question: On how many return lines did we receive a different quantity from what the customer said they returned?
    stratum: data_quality
    difficulty: medium
    split: dev
    route: data_agent
    behavior: answer
    compare: scalar
    sql: |
      SELECT COUNT(*) FROM customer_return_lines
      WHERE qty_received_cases > 0 AND qty_received_cases <> qty_requested_cases

