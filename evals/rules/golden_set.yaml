- id: R14
  question: If we claim compensation from an international road carrier, what interest can we add and from what
    date?
  behavior: answer
  route: rules_agent
  question_type: rule or limit
  difficulty: medium
  document: cmr_convention
  sections:
  - Article 27
  pages:
  - 13
  evidence:
  - char_start: 28550
    char_end: 28857
    quote: 1. The claimant shall be entitled to claim interest on compensation payable. Such interest, calculated
      at five per centum per annum, shall accrue from the date on which the claim was sent in writing to the carrier
      or, if no such claim has been made, from the date on which legal proceedings were instituted.
  reference_answer: You can claim interest at 5% per year. It runs from the date the written claim was sent to the
