  behavior: answer
  route: rules_agent
  question_type: multi-section
  difficulty: medium
  document: gs1_logistic_label
  sections:
  - '4.5'
  - '4.6'
  pages:
  - 17
  - 18
  evidence:
  - char_start: 36906
    char_end: 37188
    quote: Trade (net) measures are used to complete the identification of a variable measure trade item. They contain
      information such as the weight, size, volume or dimension of a variable measure trade item and, therefore,
      should never be applied alone but with the GTIN (with leading ’9’).
  - char_start: 39914
    char_end: 40070
    quote: Dates always relate to the GTIN specified on the label as AI (01) GTIN or as AI (02) CONTENT or AI (8006)
      ITIP or AI (8026) ITIP CONTENT. [GENSPECS, 4.14.2]
  reference_answer: No. Net weight or other variable measures must not be used on their own; they must be used with
    the GTIN with leading 9. Any date on the label relates to the GTIN/content item code shown as AI (01), AI (02),
    AI (8006), or AI (8026).
