- id: R23
  question: For a safety recall, what must our written notice tell customers to do with the product, and what must
    we guarantee about the fix and return or collection costs?
  behavior: answer
  route: rules_agent
  question_type: multi-section
  difficulty: medium
  document: eu_gpsr
  sections:
  - Article 36
  - Article 37
  pages:
  - 41
  - 42
  evidence:
  - char_start: 161408
    char_end: 161543
    quote: '- (d) a clear description of the action consumers should take, including an instruction to immediately
      stop using the recalled product;'
  - char_start: 162433
    char_end: 162748
    quote: Without prejudice to Directives (EU) 2019/770 and (EU) 2019/771, in the case of a product safety recall
      initiated by an economic operator or ordered by a national competent authority, the economic operator responsible
      for the product safety recall shall offer the consumer an effective, cost-free and timely remedy.
  - char_start: 164855
    char_end: 165135
    quote: The remedy shall not entail significant inconvenience for the consumer. The consumer shall not bear the
      costs of shipping or otherwise returning the product. For products that by their nature are not portable,
      the economic operator shall arrange for the collection of the product.
  reference_answer: The written recall notice must clearly tell consumers what to do, including to stop using the
    recalled product immediately. The responsible operator must provide an effective, free and timely remedy, without
    significant inconvenience; consumers must not pay shipping or return costs, and non-portable products must be
    collected by the operator.
  split: dev
- id: R24
  question: As importer, if we suspect incoming stock doesn’t meet safety or manufacturer compliance rules before
    we ship it out, what should we do?
  behavior: answer
  route: rules_agent
  question_type: procedure
  difficulty: medium
  document: eu_gpsr
  sections:
  - Article 11
  pages:
  - 25
  evidence:
  - char_start: 106002
    char_end: 106307
    quote: Where an importer considers or has reason to believe, on the basis of the information in that importer’s
      possession, that a product is not in conformity with Article 5 and Article 9(2), (5) and (6), the importer
      shall not place the product on the market until the product has been brought into conformity.
  - char_start: 106308
    char_end: 106535
    quote: Furthermore, where the product is a dangerous product, the importer shall immediately inform the manufacturer
      thereof and ensure that the market surveillance authorities are informed thereof through the Safety Business
      Gateway.
  reference_answer: Do not place the product on the market until it has been brought into conformity. If it is dangerous,
    immediately inform the manufacturer and make sure the market surveillance authorities are informed through the
    Safety Business Gateway.
