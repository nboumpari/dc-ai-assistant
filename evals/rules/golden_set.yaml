- id: R13
  question: If the receiver disputes the charges on the CMR note, does the carrier still have to hand over the goods?
  behavior: answer
  route: rules_agent
  question_type: rule or limit
  difficulty: easy
  document: cmr_convention
  sections:
  - Article 13
  pages:
  - 8
  evidence:
  - char_start: 15286
    char_end: 15596
    quote: The consignee who avails himself of the rights granted to him under paragraph 1 of this article shall
      pay the charges shown to be due on the consign ment note, but in the event of dispute on this matter the carrier
      shall not be required to deliver the goods unless security has been furnished by the consignee.
  reference_answer: No. If the charges are disputed, the carrier does not have to deliver the goods unless the consignee
