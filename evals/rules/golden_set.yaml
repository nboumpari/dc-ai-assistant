- id: R05
  question: For limited quantity dangerous goods, can we use shrink- or stretch-wrapped trays as the outer pack,
    and what’s the max gross weight?
  behavior: answer
  route: rules_agent
  question_type: rule or limit
  difficulty: medium
  document: adr_2025
  sections:
  - DANGEROUS GOODS PACKED IN LIMITED QUANTITIES
  pages:
  - 663
  evidence:
  - char_start: 21739
    char_end: 22040
    quote: Except for articles of Division 1.4, Compatibility Group S, shrink-wrapped or stretch-wrapped trays meeting
      the conditions of 4.1.1.1, 4.1.1.2 and 4.1.1.4 to 4.1.1.8 are acceptable as outer packagings for articles
      or inner packagings containing dangerous goods carried in accordance with this Chapter.
  - char_start: 22371
    char_end: 22430
    quote: The total gross mass of the package shall not exceed 20 kg.
  reference_answer: Yes, shrink- or stretch-wrapped trays may be used as the outer packaging for limited quantity
    dangerous goods, except for Division 1.4 Compatibility Group S articles, and only if the stated packaging conditions
