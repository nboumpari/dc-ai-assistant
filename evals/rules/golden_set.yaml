      visible recall notice or safety warning through other appropriate channels, ensuring the widest possible reach
      including, where available, the company’s website, social media channels, newsletters and retail outlets and,
      as appropriate, announcements in mass media and other communication channels.
  reference_answer: Notify every affected consumer you can identify directly and without undue delay. If you cannot
    contact everyone directly, issue a clear, visible recall notice or safety warning through other suitable channels
    with the widest possible reach, such as the company website, social media, newsletters, retail outlets and,
    where appropriate, mass media.
  split: test
