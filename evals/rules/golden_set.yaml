- id: R16
  question: How should a driver log commercial driving that falls outside these drivers’ hours rules, and standby
    time?
  behavior: answer
  route: rules_agent
  question_type: procedure
  difficulty: medium
  document: eu_561_2006
  sections:
  - Article 6
  pages: []
  evidence:
  - char_start: 12650
    char_end: 13111
    quote: A driver shall record as other work any time spent as described in point (e) of Article 4 as well as
      any time spent driving a vehicle used for commercial operations that do not fall within the scope of this
      Regulation, and shall record any periods of availability, as defined in point (b) of Article 3 of Directive
      2002/15/EC, in accordance with point (b)(iii) of Article 34(5) of Regulation (EU) No 165/2014 of the European
      Parliament and of the Council ( 2 ).
  - char_start: 13112
    char_end: 13247
