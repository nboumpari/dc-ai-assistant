- id: R07
  question: For LQ packs, what size must the diamond mark be, and how small can it go if the pack is too small?
  behavior: answer
  route: rules_agent
  question_type: table lookup
  difficulty: medium
  document: adr_2025
  sections:
  - 3.4.7
  pages:
  - 664
  evidence:
  - char_start: 23322
    char_end: 23438
    quote: The minimum dimensions shall be 100 mm × 100 mm and the minimum width of the line forming the diamond
      shall be 2 mm.
  - char_start: 23549
    char_end: 23733
    quote: If the size of the package so requires, the minimum outer dimensions shown in Figure 3.4.7.1 may be reduced
      to be not less than 50 mm × 50 mm provided the mark remains clearly visible.
  - char_start: 23734
    char_end: 23820
    quote: The minimum width of the line forming the diamond may be reduced to a minimum of 1 mm.
  reference_answer: The normal minimum size is 100 mm × 100 mm, with a 2 mm minimum diamond line. If the package
