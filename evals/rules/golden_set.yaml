questions:
- id: R01
  question: For an aerosol shipment, what does group A mean?
  behavior: answer
  route: rules_agent
  question_type: definition
  difficulty: easy
  document: adr_2025
  sections:
  - 2.2.2.1.6
  pages:
  - 159
  evidence:
  - char_start: 11276
    char_end: 11516
    quote: A asphyxiant; O oxidizing; F flammable; T toxic; C corrosive; CO corrosive, oxidizing; FC flammable,
      corrosive; TF toxic, flammable; TC toxic, corrosive; TO toxic, oxidizing; TFC toxic, flammable, corrosive;
      TOC toxic, oxidizing, corrosive.
  reference_answer: For aerosols, group A means asphyxiant.
  split: dev
