  question_type: procedure
  difficulty: medium
  document: eu_gpsr
  sections:
  - Article 35
  pages:
  - 40
  evidence:
  - char_start: 157791
    char_end: 158297
    quote: In the case of a product safety recall, or where certain information has to be brought to the attention
      of consumers to ensure the safe use of a product (‘safety warning’), economic operators, in accordance with
      their respective obligations as provided for in Articles 9, 10, 11 and 12, and providers of online marketplaces
      in accordance with their obligations as provided for in Article 22(12), shall ensure that all affected consumers
      that can be identified are notified directly and without undue delay.
  - char_start: 159621
    char_end: 160136
