- id: R03
  question: How do I count the load quantity for the small-load ADR exemption for articles, solids/gases and liquids?
  behavior: answer
  route: rules_agent
  question_type: procedure
  difficulty: medium
  document: adr_2025
  sections:
  - 1.1.3.6
  pages:
  - 31
  evidence:
  - char_start: 5456
    char_end: 5778
    quote: For articles, total mass in kilograms of the articles without their packagings (for articles of Class
      1, net mass in kilograms of the explosive substance; for dangerous goods in machinery and equipment specified
      in this Annex, the total quantity of dangerous goods contained therein in kilograms or litres as appropriate);
  - char_start: 5785
    char_end: 5886
    quote: For solids, liquefied gases, refrigerated liquefied gases and dissolved gases, net mass in kilograms;
  - char_start: 5893
    char_end: 5964
    quote: For liquids, the total quantity of dangerous goods contained in litres;
  reference_answer: Count articles as the total mass in kg without packaging; for Class 1 articles use net explosive
    mass, and for dangerous goods in machinery/equipment use the contained quantity in kg or litres as appropriate.
    Count solids, liquefied gases, refrigerated liquefied gases and dissolved gases as net kg. Count liquids as
    the litres of dangerous goods contained.
  split: dev
