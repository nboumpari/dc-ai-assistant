- id: R20
  question: What truck weight brings our goods deliveries under the EU driving-time rules?
  behavior: answer
  route: rules_agent
  question_type: rule or limit
  difficulty: medium
  document: eu_561_2006
  sections:
  - Article 2
  pages: []
  evidence:
  - char_start: 2309
    char_end: 2436
    quote: '(a)


      of goods where the maximum permissible mass of the vehicle, including any trailer, or semi-trailer, exceeds
      3,5 tonnes, or'
  - char_start: 2443
    char_end: 2654
    quote: '(aa)


      from 1 July 2026, of goods in international transport operations or in cabotage operations, where the maximum
      permissible mass of the vehicle, including any trailer, or semi-trailer, exceeds 2,5 tonnes, or'
  reference_answer: For goods transport, the rules apply when the vehicle’s maximum permissible mass, including
    any trailer or semi-trailer, exceeds 3.5 tonnes. From 1 July 2026, they also apply to international transport
    or cabotage operations where that mass exceeds 2.5 tonnes.
  split: dev
- id: R21
  question: For a company van doing our own goods run, what weight band is exempt if driving isn’t the driver’s
    main job?
  behavior: answer
  route: rules_agent
  question_type: table lookup
  difficulty: medium
  document: eu_561_2006
  sections:
  - Article 3
  pages: []
  evidence:
  - char_start: 5524
    char_end: 5896
    quote: vehicles with a maximum permissible mass, including any trailer, or semi-trailer exceeding 2,5 tonnes
      but not exceeding 3,5 tonnes that are used for the transport of goods, where the transport is not effected
      for hire or reward, but on the own account of the company or the driver, and where driving does not constitute
      the main activity of the person driving the vehicle;
  reference_answer: The exemption applies to goods vehicles over 2.5 tonnes but not over 3.5 tonnes maximum permissible
    mass, including any trailer or semi-trailer. The trip must be own-account, not for hire or reward, and driving
    must not be the driver’s main activity.
  split: dev
