- id: R08
  question: If the customer redirects a load to someone else and it then can’t be delivered, who is treated as the
    sender and who as the receiver?
  behavior: answer
  route: rules_agent
  question_type: definition
  difficulty: medium
  document: cmr_convention
  sections:
  - Article 15
  pages:
  - 8
  evidence:
  - char_start: 16913
    char_end: 17241
    quote: When circumstances preventing delivery of the goods arise after the consignee, in exercise of his rights
      under article 12, paragraph 3, has given an order for the goods to be delivered to another person, paragraphs
      1 and 2 of this article shall apply as if the consignee were the sender and that other person were the consignee.
  reference_answer: The original consignee is treated as the sender, and the person they redirected the goods to
    is treated as the consignee.
  split: test
- id: R09
  question: For a CMR road claim with several hauliers, what is the claim deadline, and how do we split the bill
    if we can’t tell which haulier caused the damage?
  behavior: answer
  route: rules_agent
  question_type: multi-section
  difficulty: hard
  document: cmr_convention
  sections:
  - Article 32
  - Article 37
  pages:
  - 16
  - 17
  evidence:
  - char_start: 34414
    char_end: 34754
    quote: The period of limitation for an action arising out of carriage under this Convention shall be one year.
      Nevertheless, in the case of wilful misconduct, or such default as in accordance with the law of the court
      or tribunal seised of the case, is considered as equivalent to wilful misconduct, the period of limi tation
      shall be three years.
  - char_start: 38391
    char_end: 38705
    quote: When the loss or damage has been caused by the action of two or more carriers, each of them shall pay
      an amount proportionate to his share of liability; should it be impossible to apportion the liability, each
      carrier shall be liable in proportion to the share of the payment for the carriage which is due to him ;
  - char_start: 38713
    char_end: 38914
    quote: If it cannot be ascertained to which carriers liability is attributable for the loss or damage, the amount
      of the compensation shall be apportioned between all the carriers as laid down in _(b)_ above.
  reference_answer: 'The time limit to bring the claim is one year, or three years if there is wilful misconduct
    or an equivalent default. If it cannot be worked out which carrier caused the loss or damage, the compensation
    is split between all carriers: by share of liability if possible, otherwise in proportion to each carrier’s
    share of the carriage payment.'
  split: dev
- id: R10
  question: For a paid truck shipment between two countries, what checks tell me CMR covers it?
  behavior: answer
  route: rules_agent
  question_type: procedure
  difficulty: medium
  document: cmr_convention
  sections:
  - Article 1
  pages:
  - 2
  evidence:
  - char_start: 1117
    char_end: 1499
    quote: 1. This Convention shall apply to every contract for the carriage of goods by road in vehicles for reward,
      when the place of taking over of the goods and the place designated for delivery, as specified in the contract,
      are situated in two different countries, of which at least one is a contracting country, irrespective of the
      place of residence and the nationality of the parties.
  reference_answer: Check that the contract is for paid carriage of goods by road in a vehicle, that the pickup
    and delivery places named in the contract are in two different countries, and that at least one of those countries
    is a contracting country. The parties’ residence or nationality does not affect coverage.
  split: test
- id: R11
  question: If a cargo loss, damage or delay claim is made outside the transport contract, who can rely on the CMR
    liability exclusions or compensation limits?
  behavior: answer
  route: rules_agent
  question_type: rule or limit
  difficulty: medium
  document: cmr_convention
  sections:
  - Article 28
  pages:
  - 13
  - 14
  evidence:
  - char_start: 29139
    char_end: 29432
    quote: 1. In cases where, under the law applicable, loss, damage or delay arising out of carriage under this
      Convention gives rise to an extra-contractual claim, the carrier may avail himself of the provisions of this
      Convention which exclude his liability or which fix or limit the compensation due.
  - char_start: 29434
    char_end: 29768
    quote: 2. In cases where the extra-contractual liability for loss, damage or delay of one of the persons for
      whom the carrier is responsible under the terms of article 3 is in issue, such person may also avail himself
      of the provisions of this Convention which exclude the liability of the carrier or which fix or limit the
      compensation due.
  reference_answer: The carrier can rely on the Convention’s liability exclusions and compensation limits for extra-contractual
    claims about loss, damage or delay. A person for whom the carrier is responsible under article 3 can also rely
    on those same exclusions or limits when their extra-contractual liability is in issue.
  split: dev
