server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # the API, including the streamed answers (Server-Sent Events)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;          # send each event to the browser as soon as it arrives
        proxy_cache off;
        proxy_read_timeout 300s;      # rules answers can take a while on the CPU
    }

    # the page and its assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
