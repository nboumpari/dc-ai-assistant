[project]
name = "dc-ai-assistant"
version = "0.1.0"
description = "Two warehouse AI assistants: a text-to-SQL data assistant and a RAG rules assistant over public standards and regulations."
readme = "README.md"
authors = [
    { name = "nefeliboubari" }
]
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2.24",
    "langsmith>=0.16.0",
    "openai>=3.57.0",
    "pymupdf>=2.1",
    "pymupdf4llm>=2.1",
    "pyyaml>=6.0.4",
    "rank-bm25>=0.2.2",
]

[project.scripts]
dc-ai-assistant = "dc_ai_assistant:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
